[graph]
targets = ["aarch64-linux-android"]

[licenses]
# Explicit allowlist: anything not listed here is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[advisories]
# Vulnerabilities and unmaintained/yanked crates fail the check by default.
