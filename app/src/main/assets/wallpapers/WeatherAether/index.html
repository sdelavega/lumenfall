<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Aether</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#wa-sky{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#wa-current{position:fixed;top:calc(50% - 220px);left:50%;transform:translateX(-50%);z-index:10;width:fit-content;max-width:min(624px,84%);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.6),0 0 14px rgba(0,0,0,0.22);pointer-events:none}
#wa-current-scrim{position:relative;background:linear-gradient(155deg,rgba(30,40,65,0.52) 0%,rgba(15,20,45,0.42) 100%);backdrop-filter:blur(36px) saturate(1.7);-webkit-backdrop-filter:blur(36px) saturate(1.7);border-radius:24px;padding:26px 34px 22px;border:1px solid rgba(255,255,255,0.20);box-shadow:0 10px 44px rgba(0,0,0,0.28),inset 0 1px 0 rgba(255,255,255,0.38),inset 0 -1px 0 rgba(0,0,0,0.10)}
#wa-top-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
#wa-icon{width:53px;height:53px;display:none;flex-shrink:0}
#wa-location{font-size:20px;font-weight:500;opacity:0.92;letter-spacing:0.2px}
#wa-temp{font-size:86px;font-weight:200;line-height:1;letter-spacing:-1px;margin-bottom:2px}
#wa-desc{font-size:23px;font-weight:400;opacity:0.88;margin-bottom:12px}
#wa-details{font-size:16px;opacity:0.78;line-height:1.7;display:flex;flex-wrap:wrap;gap:4px 16px}
#wa-forecast{position:fixed;top:calc(50% + 186px);left:50%;bottom:auto;right:auto;transform:translateX(-50%);z-index:10;display:flex;gap:8px;width:min(860px,88%);pointer-events:none;opacity:0.9;transition:opacity 0.3s}
.wa-fc-card{flex:1;background:linear-gradient(155deg,rgba(30,40,65,0.46) 0%,rgba(15,20,45,0.36) 100%);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border-radius:16px;padding:13px 8px 11px;text-align:center;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,0.8),0 0 10px rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.18);box-shadow:0 4px 22px rgba(0,0,0,0.20),inset 0 1px 0 rgba(255,255,255,0.28);transition:border-color 0.3s}
.wa-fc-day{font-size:13px;font-weight:800;opacity:0.9;margin-bottom:6px;letter-spacing:0.6px}
.wa-fc-icon{height:34px;display:flex;align-items:center;justify-content:center}
.wa-fc-icon img{width:34px;height:34px;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.7)) brightness(1.1)}
.wa-fc-temps{font-size:15px;margin:4px 0 2px;display:flex;align-items:baseline;justify-content:center;gap:5px;filter:brightness(1.1)}
.wa-fc-hi{font-weight:700}
.wa-fc-lo{opacity:0.72;font-size:13px}
.wa-fc-precip{font-size:11.5px;color:var(--accent,#6fb8ff);font-weight:700;letter-spacing:0.2px;text-shadow:0 1px 5px rgba(0,0,0,0.85),0 0 10px rgba(0,0,0,0.5);filter:brightness(1.35)}
#wa-pill{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,0.9);font-size:11.5px;padding:5px 16px;border-radius:12px;opacity:0;transition:opacity 0.5s;pointer-events:none;white-space:nowrap}
#wa-pill.wa-pill-visible{background:linear-gradient(155deg,rgba(30,40,65,0.48) 0%,rgba(15,20,45,0.38) 100%);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.18);box-shadow:0 2px 12px rgba(0,0,0,0.20),inset 0 1px 0 rgba(255,255,255,0.26);text-shadow:0 1px 3px rgba(0,0,0,0.5);opacity:1}
#wa-attribution{position:absolute;bottom:9px;right:14px;z-index:30;pointer-events:none;font-size:10px;font-weight:500;letter-spacing:0.2px;color:rgba(255,255,255,0.50);text-shadow:0 1px 2px rgba(0,0,0,0.6)}
.wa-preview-minimal #wa-current,.wa-preview-minimal #wa-forecast,.wa-preview-minimal #wa-pill{display:none!important}
</style>
</head>
<body>
<canvas id="wa-sky"></canvas>
<div id="wa-current">
  <div id="wa-current-scrim">
    <div id="wa-top-row">
      <img id="wa-icon" alt="">
      <div id="wa-location">Unknown</div>
    </div>
    <div id="wa-temp">--</div>
    <div id="wa-desc"></div>
    <div id="wa-details">
      <span id="wa-feels"></span>
      <span id="wa-humidity"></span>
      <span id="wa-wind"></span>
      <span id="wa-uv"></span>
    </div>
    <div id="wa-attribution"></div>
  </div>
</div>
<div id="wa-forecast"></div>
<div id="wa-pill"></div>
<script src="js/main.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/weather.js"></script>
<script src="js/renderer.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
