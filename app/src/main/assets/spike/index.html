<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumenfall web spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f1c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; top: 16px;
    font: 14px/1.4 monospace; color: #7fffd4; opacity: .85;
    text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">Lumenfall web spike — booting…</div>
  <script>
    // ---- Proves three things on a real device ----
    // 1. A WebView is actually compositing onto the wallpaper surface.
    // 2. requestAnimationFrame drives a steady animation (read the FPS in the HUD).
    // 3. The native bridge round-trips (heartbeat + fps posted back to Kotlin).

    var cv = document.getElementById('c');
    var ctx = cv.getContext('2d');
    var hud = document.getElementById('hud');
    var dpr = window.devicePixelRatio || 1;

    function resize() {
      cv.width = Math.floor(innerWidth * dpr);
      cv.height = Math.floor(innerHeight * dpr);
    }
    resize();
    addEventListener('resize', resize);

    var suspended = false;

    // The host injects window.aetherDesk *after* first paint, so poll for it and
    // wire suspend/resume once it exists. (Production should inject at
    // document-start; see the spike doc.)
    function bindHost() {
      if (window.aetherDesk && window.aetherDesk.system) {
        window.aetherDesk.system.suspend = function () { suspended = true; };
        window.aetherDesk.system.resume = function () {
          if (suspended) { suspended = false; requestAnimationFrame(frame); }
        };
        return true;
      }
      return false;
    }
    if (!bindHost()) {
      var iv = setInterval(function () { if (bindHost()) clearInterval(iv); }, 100);
    }

    var t0 = performance.now();
    var frames = 0, fpsAt = t0, fps = 0;

    function frame(now) {
      if (suspended) return;
      var t = (now - t0) / 1000;

      ctx.fillStyle = '#0a0f1c';
      ctx.fillRect(0, 0, cv.width, cv.height);

      var cx = cv.width / 2, cy = cv.height / 2;
      var base = Math.min(cv.width, cv.height) * 0.35;
      for (var i = 0; i < 60; i++) {
        var a = t * 0.6 + i * 0.1047;
        var r = base * (0.5 + 0.5 * Math.sin(t * 0.7 + i * 0.3));
        var x = cx + Math.cos(a) * r;
        var y = cy + Math.sin(a) * r;
        ctx.beginPath();
        ctx.arc(x, y, (3 + 2 * Math.sin(t + i)) * dpr, 0, Math.PI * 2);
        ctx.fillStyle = 'hsl(' + ((i * 6 + t * 40) % 360) + ',80%,60%)';
        ctx.fill();
      }

      frames++;
      if (now - fpsAt >= 1000) {
        fps = frames;
        frames = 0;
        fpsAt = now;
        hud.textContent = 'Lumenfall web spike — ' + fps + ' fps @ ' +
          Math.round(innerWidth) + '×' + Math.round(innerHeight) + ' (dpr ' + dpr + ')';
        if (window.aetherDesk) {
          window.aetherDesk.postMessage({ heartbeat: true, fps: fps });
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
