name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # The Linux job previews F-Droid's build environment: a clean checkout, no
    # signing key (Gradle falls back to the debug key) and the reproducibility
    # check, all on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # repro-check and the Rust JNI build need the NDK the project pins.
      - name: Install NDK
        run: yes | sdkmanager "ndk;27.3.13750724" > /dev/null

      # rust-toolchain.toml pins the compiler and the Android target. With no
      # argument, `rustup toolchain install` installs the toolchain the file
      # names; `rustup show` logs what is in use.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just,cargo-deny

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Gate
        run: just gate
