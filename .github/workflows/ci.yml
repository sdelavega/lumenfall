name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # The Linux job is F-Droid's build environment: a clean checkout, no signing
    # key (the release build stays unsigned) and the reproducibility check, all on
    # Linux. Its unsigned release APK is what gets shipped: the maintainer
    # downloads the release-apk artifact and signs it locally.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # repro-check and the Rust JNI build need the NDK the project pins.
      - name: Install NDK
        run: yes | sdkmanager "ndk;27.3.13750724" > /dev/null

      # rust-toolchain.toml pins the compiler and the Android target. With no
      # argument, `rustup toolchain install` installs the toolchain the file
      # names; `rustup show` logs what is in use.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just,cargo-deny

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2

      # The gate's repro-check prints "repro-check: identical (<sha256>)" and
      # copies the hash to the run summary.
      - name: Gate
        run: just gate

      # The reproducible APK and the Rust core from the repro-check tree, for
      # diffing against a local (macOS) build when the hashes differ.
      - name: Upload repro APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-apk
          path: build/repro/
          if-no-files-found: error
          retention-days: 14

      # The canonical release build (Linux NDK packages differ from macOS ones, and
      # F-Droid builds on Linux). No keystore here, so the APK is unsigned;
      # scripts/release.sh downloads it, signs it with apksigner and publishes it.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Checksum release APK
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256
          cat app-release-unsigned.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 90
