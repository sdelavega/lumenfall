#
# Rust install: follows the mechanism of the current ArcaneChat recipe
#   https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/chat.delta.lite.yml
# which gets rustup from the `rustup@1.25.1` srclib, runs
# `$$rustup$$/rustup-init.sh -y --default-toolchain ... --target ...`, then
# `source $HOME/.cargo/env`. ArcaneChat drives Rust through its own script.
# UNTESTED ON A BUILD SERVER (maintainer must test-build): the cargo-ndk install,
# the direct `cargo ndk` invocation and the PATH handling are this project's own.
# fdroidserver deletes gradlew before `build:`, so the .so is built here, not via
# Gradle, with the exact command and RUSTFLAGS of cargoNdkBuild in
# app/build.gradle.kts so the output matches the GitHub APK. The GitHub APK is
# CI's Linux release build signed locally (see docs/releasing.md); F-Droid also
# builds on Linux, which is why the two can match entry for entry (macOS NDK
# packages build a different .so). Known risk: the later
# Gradle run would rerun cargoNdkBuild (no task history), so `gradleprops` passes
# -Plumenfall.prebuiltJni, which skips that task and fails fast if the .so is missing.

Categories:
  - Theming
License: GPL-3.0-or-later
AuthorName: Stephen de la Vega
SourceCode: https://github.com/sdelavega/lumenfall
IssueTracker: https://github.com/sdelavega/lumenfall/issues
Changelog: https://github.com/sdelavega/lumenfall/releases

AutoName: Lumenfall

RepoType: git
Repo: https://github.com/sdelavega/lumenfall.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    # Full commit hash of v1.0.0 (as submitted in fdroiddata !54054).
    commit: 56d523fd40acebee2424dfef300c634dd57d54ff
    subdir: app
    timeout: 20000
    # No sudo/JDK step: the buildserver's default JDK (21 on Debian trixie) produces the
    # same APK as CI's JDK 17 — the app is all Kotlin, compiled to dex by R8.
    srclibs:
      - rustup@1.25.1
    binary: https://github.com/sdelavega/lumenfall/releases/download/v%v/Lumenfall-%v.apk
    gradle:
      - yes
    gradleprops:
      - lumenfall.prebuiltJni
    ndk: 27.3.13750724
    build:
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.99.1 --target aarch64-linux-android --profile minimal
      - source $HOME/.cargo/env
      - cargo install cargo-ndk --version 4.1.2 --locked
      # Same command and --remap-path-prefix triple as cargoNdkBuild (workspace
      # root, CARGO_HOME, RUSTUP_HOME), run from the repository root.
      - >-
        source $HOME/.cargo/env && root=$(cd .. && pwd) &&
        cd "$root" &&
        RUSTFLAGS="--remap-path-prefix=$root=/lumenfall --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
        cargo ndk -t arm64-v8a --platform 33 -o "$root/app/build/rustJniLibs"
        build --release --locked -p lumenfall-core

# Value to be filled in by the maintainer after running `just signing-fingerprint`
# (the SHA-256 recorded in docs/signing-cert.sha256, lowercase hex, no colons).
AllowedAPKSigningKeys: ff01c5f6726274800a11b7bd644719c0ef717620f73ec87900ee57191790cee1

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
